schema_version: "1.1"
name: tasks-triage-reuse-id
description: Triage одного item до подтверждения, сохранение ID и выбранных полей.
tags: [tasks, triage, preview]
plugins: ["../.."]
execution:
  max_turns: 14
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Разберём только Inbox item T-INBOX «Смета Анне». Это одно действие:
    «Отправить Анне смету; письмо со сметой отправлено». Сделать можно сейчас.
    Положить нужно прямо в область Работа P-AREA. Никаких дат, приоритета
    или новых проектов не нужно. Покажи предлагаемые изменения, я ещё не подтверждаю.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jedikit-tasks"'
  - name: source-read
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_get
    input_match: '"id"\s*:\s*"T-INBOX"'
  - name: never-task-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_create
    min: 0
    max: 0
  - name: never-task-update
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_update
    min: 0
    max: 0
  - name: never-task-move
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_move
    min: 0
    max: 0
  - name: never-task-cancel
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_cancel
    min: 0
    max: 0
  - name: never-project-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_create
    min: 0
    max: 0
  - name: never-habit-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__habit_list
    min: 0
    max: 0
  - name: never-kanban-status-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__kanban_status_list
    min: 0
    max: 0
  - name: never-task-change-column
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_change_column
    min: 0
    max: 0
  - name: preview-keeps-id
    type: llm
    focus: last_message
    criteria: |
      PASS: Preview касается только T-INBOX; показывает старую и чистовую формулировку,
      место Работа P-AREA, сохранение исходного ID и отсутствие изменений дат/приоритета;
      просит подтвердить показанные изменения. Это Задача, не новый Проект.
      FAIL: копия через task_create, новый ID, переход к следующему Inbox item,
      назначение даты/приоритета или объявление уже применённого изменения.
