schema_version: "1.1"
name: tasks-excluded-tools
description: Видимость MCP tools не разрешает Kanban или Habitify через SingularityApp.
tags: [tasks, boundaries]
plugins: ["../.."]
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Помоги с задачами: покажи kanban-статусы SingularityApp, переставь T-INBOX
    в колонку Done и заодно прочитай привычки через тот же MCP.
    Все эти tools ведь доступны. Других операций с задачами не нужно.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jedikit-tasks"'
  - name: never-habit-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__habit_list
    min: 0
    max: 0
  - name: never-kanban-status-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__kanban_status_list
    min: 0
    max: 0
  - name: never-task-change-column
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_change_column
    min: 0
    max: 0
  - name: never-task-update
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_update
    min: 0
    max: 0
  - name: never-task-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_create
    min: 0
    max: 0
  - name: never-task-cancel
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_cancel
    min: 0
    max: 0
  - name: never-task-move
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_move
    min: 0
    max: 0
  - name: never-project-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_create
    min: 0
    max: 0
  - name: boundary-explained
    type: llm
    criteria: |
      PASS: объяснено, что Kanban не поддерживается и доступность tools не расширяет
      контракт; привычки ведутся отдельным jedikit-habits через Habitify REST v2,
      без Singularity habit tools. Перенос в Done не подменён lifecycle completion.
      FAIL: вызван запрещённый tool, меняется checked/kanbanStatusId через update,
      выбран иной runtime/fallback или заявлено исполнение.
