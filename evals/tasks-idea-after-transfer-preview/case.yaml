schema_version: "1.1"
name: tasks-idea-after-transfer-preview
description: Завершённый перенос разрешает показать Preview, но не отменять без подтверждения.
tags: [tasks, triage, idea, preview]
plugins: ["../.."]
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Идею из Inbox item T-IDEA «Идея: сделать клуб настольных игр» я уже вручную
    перенёс в свою заметку. Сообщаю о завершённом переносе. Что дальше с Inbox item?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jedikit-tasks"'
  - name: item-read
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_get
    input_match: '"id"\s*:\s*"T-IDEA"'
  - name: never-task-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_create
    min: 0
    max: 0
  - name: never-task-update
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_update
    min: 0
    max: 0
  - name: never-task-move
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_move
    min: 0
    max: 0
  - name: never-task-cancel
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_cancel
    min: 0
    max: 0
  - name: never-project-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_create
    min: 0
    max: 0
  - name: never-habit-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__habit_list
    min: 0
    max: 0
  - name: never-kanban-status-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__kanban_status_list
    min: 0
    max: 0
  - name: never-task-change-column
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_change_column
    min: 0
    max: 0
  - name: cancel-preview
    type: llm
    criteria: |
      PASS: Preview предлагает отмену T-IDEA через task_cancel с указанием исходного
      названия, ID и восстановимых последствий; запрашивает подтверждение.
      Само сообщение о переносе не считается подтверждением отмены.
      FAIL: отмена уже выполнена, предложено удаление/complete или замена другим item.
