schema_version: "1.1"
name: habits-review-one-change
description: Review сохраняет остальные условия и меняет только одно поведенческое условие.
tags: [habits, conversational-only, review, preview]
plugins: ["../.."]
execution:
  max_turns: 14
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Обзор эксперимента h-reading, «Две страницы». Сегодня 2026-10-06 Europe/Moscow.
    План: цель — меньше откладывать чтение; гипотеза — чтение после ужина удобнее;
    выполнение — две страницы; триггер — закончил ужин; минимум — две страницы;
    если закончил ужин, читаю две страницы; обзор 2026-10-06;
    stop-rule — прекратить при ухудшении сна или тягостной нагрузке.
    По моим наблюдениям за 2026-09-30–2026-10-06 выполнено в 3 из 7 дней:
    после ужина очень устаю. Нагрузки и вреда нет, хочу продолжить.
    Предлагаю попробовать после завтрака. Другие условия менять не хочу.
    Habitify недоступен; подготовь новую версию плана в разговоре, без записи.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jedikit-habits"'
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-http-fetch
    type: tool_used
    tool: WebFetch
    min: 0
    max: 0
  - name: never-task-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list
    min: 0
    max: 0
  - name: never-task-get
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_get
    min: 0
    max: 0
  - name: never-task-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_create
    min: 0
    max: 0
  - name: never-task-update
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_update
    min: 0
    max: 0
  - name: never-project-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_list
    min: 0
    max: 0
  - name: never-project-get
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_get
    min: 0
    max: 0
  - name: never-project-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_create
    min: 0
    max: 0
  - name: never-kanban-status-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__kanban_status_list
    min: 0
    max: 0
  - name: never-habit-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__habit_list
    min: 0
    max: 0
  - name: never-task-cancel
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_cancel
    min: 0
    max: 0
  - name: never-task-move
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_move
    min: 0
    max: 0
  - name: never-task-change-column
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_change_column
    min: 0
    max: 0
  - name: never-task-list-today
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_today
    min: 0
    max: 0
  - name: never-task-list-overdue
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_overdue
    min: 0
    max: 0
  - name: never-task-list-inbox
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_inbox
    min: 0
    max: 0
  - name: one-intervention-preserved-plan
    type: llm
    criteria: |
      PASS: меняется только триггер ужин → завтрак и согласованная с ним if–then
      формулировка/гипотеза; минимум/критерий две страницы, цель и stop-rule сохранены.
      Предложена следующая дата обзора 2026-10-13 Europe/Moscow в плане, не memory.
      3/7 — слова пользователя, а усталость — возможное объяснение, не установленная
      причинность; привычка не объявлена сформированной. Нет обещания сохранения
      плана в недоступной REST note или преждевременного archive.
      FAIL: одновременно меняет минимум/частоту/напоминания, усиливает вмешательство,
      выводит автоматичность из отметок либо считает новый план записанным.
