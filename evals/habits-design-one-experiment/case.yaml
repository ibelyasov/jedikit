schema_version: "1.1"
name: habits-design-one-experiment
description: Разговорный design одного эксперимента со всеми полями плана.
tags: [habits, conversational-only, design]
plugins: ["../.."]
execution:
  max_turns: 14
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Хочу меньше откладывать чтение книги. Мне 30 лет. Проверю, помогает ли
    книга на кухонном столе начать чтение после завтрака. Для меня выполнение —
    прочитать две страницы после завтрака; можно читать больше, но это не нужно.
    Если после завтрака вижу книгу, читаю две страницы. Обзор 2026-10-13,
    Europe/Moscow. Если эксперимент ухудшает сон или начинает тяготить,
    остановлю его. Название в Habitify — «Две страницы после завтрака».
    Habitify в этой сессии недоступен; составь план в разговоре, ничего не создавай.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jedikit-habits"'
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-http-fetch
    type: tool_used
    tool: WebFetch
    min: 0
    max: 0
  - name: never-task-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list
    min: 0
    max: 0
  - name: never-task-get
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_get
    min: 0
    max: 0
  - name: never-task-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_create
    min: 0
    max: 0
  - name: never-task-update
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_update
    min: 0
    max: 0
  - name: never-project-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_list
    min: 0
    max: 0
  - name: never-project-get
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_get
    min: 0
    max: 0
  - name: never-project-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_create
    min: 0
    max: 0
  - name: never-kanban-status-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__kanban_status_list
    min: 0
    max: 0
  - name: never-habit-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__habit_list
    min: 0
    max: 0
  - name: never-task-cancel
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_cancel
    min: 0
    max: 0
  - name: never-task-move
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_move
    min: 0
    max: 0
  - name: never-task-change-column
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_change_column
    min: 0
    max: 0
  - name: never-task-list-today
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_today
    min: 0
    max: 0
  - name: never-task-list-overdue
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_overdue
    min: 0
    max: 0
  - name: never-task-list-inbox
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_inbox
    min: 0
    max: 0
  - name: complete-one-plan
    type: llm
    criteria: |
      PASS: один человекочитаемый план включает цель/одну гипотезу, одно наблюдаемое
      поведение и критерий отметки, триггер после завтрака, минимум две страницы,
      if–then, дату обзора 2026-10-13 Europe/Moscow и stop-rule по нагрузке/сну.
      Нет пакета привычек, медицинских обещаний, машинных metadata и гарантии срока
      формирования. Честно сказано, что привычка/заметка не записаны в Habitify;
      инструкция ручного размещения плана соответствует ограничению notes в #4.
      FAIL: пропущено обязательное поле, придуман habitId, обещано сохранение в memory
      или provider, добавлено второе вмешательство либо чтение REST симулируется как факт.
