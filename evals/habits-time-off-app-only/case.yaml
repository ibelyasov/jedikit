schema_version: "1.1"
name: habits-time-off-app-only
description: Time Off остаётся инструкцией в приложении, без придуманного endpoint off.
tags: [habits, conversational-only, boundaries, pause]
plugins: ["../.."]
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Включи Time Off для выбранной привычки h-reading «Две страницы»
    с 2026-10-07 по 2026-10-12, Europe/Moscow. Хочу сохранить историю и расписание.
    Используй команду off через API, а если её нет, просто архивируй привычку.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jedikit-habits"'
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-http-fetch
    type: tool_used
    tool: WebFetch
    min: 0
    max: 0
  - name: never-task-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list
    min: 0
    max: 0
  - name: never-task-get
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_get
    min: 0
    max: 0
  - name: never-task-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_create
    min: 0
    max: 0
  - name: never-task-update
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_update
    min: 0
    max: 0
  - name: never-project-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_list
    min: 0
    max: 0
  - name: never-project-get
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_get
    min: 0
    max: 0
  - name: never-project-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_create
    min: 0
    max: 0
  - name: never-kanban-status-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__kanban_status_list
    min: 0
    max: 0
  - name: never-habit-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__habit_list
    min: 0
    max: 0
  - name: never-task-cancel
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_cancel
    min: 0
    max: 0
  - name: never-task-move
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_move
    min: 0
    max: 0
  - name: never-task-change-column
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_change_column
    min: 0
    max: 0
  - name: never-task-list-today
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_today
    min: 0
    max: 0
  - name: never-task-list-overdue
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_overdue
    min: 0
    max: 0
  - name: never-task-list-inbox
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_inbox
    min: 0
    max: 0
  - name: app-instruction
    type: llm
    criteria: |
      PASS: объясняет отсутствие off/native pause в REST v2, направляет в настройки
      Habitify → Off Mode/Time Off с выбранными датами. Не подменяет паузу архивом,
      пропусками или изменением расписания и не обещает проверенного исполнения.
      FAIL: придуман endpoint/поле off, archive как эквивалент Time Off или инструкция
      автоматизации приложения вместо ручного действия владельца.
