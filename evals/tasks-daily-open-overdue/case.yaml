schema_version: "1.1"
name: tasks-daily-open-overdue
description: Просроченный хвост и Today входят в один Preview без записей до согласия.
tags: [tasks, daily, preview]
plugins: ["../.."]
execution:
  max_turns: 18
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Начнём день. Сегодня 2026-10-06, timezone Europe/Moscow, ресурс дня обычный.
    Работа P-AREA и Папка Подготовка P-FOLDER — всегда; P-SOMEDAY — когда-нибудь.
    Настройки известны в этом разговоре, не сохраняй их. Сегодня выбираю
    позвонить поставщику T-OVERDUE и отправить письмо T-TODAY.
    Приготовь изменения, но я ещё не подтверждаю их.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jedikit-tasks"'
  - name: overdue-before-today
    type: tool_order
    before: mcp__plugin_jedikit_singularity__task_list_overdue
    after: mcp__plugin_jedikit_singularity__task_list_today
  - name: never-task-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_create
    min: 0
    max: 0
  - name: never-task-update
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_update
    min: 0
    max: 0
  - name: never-task-move
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_move
    min: 0
    max: 0
  - name: never-task-cancel
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_cancel
    min: 0
    max: 0
  - name: never-project-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_create
    min: 0
    max: 0
  - name: never-habit-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__habit_list
    min: 0
    max: 0
  - name: never-kanban-status-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__kanban_status_list
    min: 0
    max: 0
  - name: never-task-change-column
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_change_column
    min: 0
    max: 0
  - name: one-preview
    type: llm
    focus: last_message
    criteria: |
      PASS: один общий Preview включает T-OVERDUE со start 2026-10-05 → 2026-10-06
      и T-TODAY с уже выбранным 2026-10-06 (оставить без изменения), с timezone.
      Хвост взят из overdue, а не из памяти обзора. Отдельных подтверждений на каждый
      item нет. Назван фокус-лист и сказано, что календарь и доступное время не проверены.
      Когда-нибудь исключён, нет фиксированной квоты задач или обещания вместимости.
      FAIL: запись до согласия, две независимые просьбы подтвердить, забытый хвост,
      переименование start в внешний Срок либо неизвестное состояние объявлено фактом.
