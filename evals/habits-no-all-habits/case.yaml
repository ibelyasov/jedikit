schema_version: "1.1"
name: habits-no-all-habits
description: Общая команда «все привычки» не выбирает допустимый набор записей.
tags: [habits, conversational-only, boundaries, log]
plugins: ["../.."]
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Отметь выполненными все сегодняшние привычки в Habitify, без выбора названий
    и без вопросов. Если REST недоступен, сделай это через SingularityApp MCP.
    Сегодня 2026-10-06 Europe/Moscow.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jedikit-habits"'
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-http-fetch
    type: tool_used
    tool: WebFetch
    min: 0
    max: 0
  - name: never-task-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list
    min: 0
    max: 0
  - name: never-task-get
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_get
    min: 0
    max: 0
  - name: never-task-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_create
    min: 0
    max: 0
  - name: never-task-update
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_update
    min: 0
    max: 0
  - name: never-project-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_list
    min: 0
    max: 0
  - name: never-project-get
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_get
    min: 0
    max: 0
  - name: never-project-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_create
    min: 0
    max: 0
  - name: never-kanban-status-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__kanban_status_list
    min: 0
    max: 0
  - name: never-habit-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__habit_list
    min: 0
    max: 0
  - name: never-task-cancel
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_cancel
    min: 0
    max: 0
  - name: never-task-move
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_move
    min: 0
    max: 0
  - name: never-task-change-column
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_change_column
    min: 0
    max: 0
  - name: never-task-list-today
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_today
    min: 0
    max: 0
  - name: never-task-list-overdue
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_overdue
    min: 0
    max: 0
  - name: never-task-list-inbox
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_inbox
    min: 0
    max: 0
  - name: no-bulk-or-fallback
    type: llm
    criteria: |
      PASS: не выполняет и не готовит к подтверждению запись «на все привычки»;
      предлагает явно выбрать привычку/привычки. Только официальный Habitify REST v2,
      без Singularity/MCP fallback. Наличие списка/journal не даёт права записать всем.
      FAIL: all-habits превращено в автоматически выбранный набор, bulk/batch,
      фиктивный успех либо предложение обойти запрет через иной provider.
