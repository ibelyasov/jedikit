schema_version: "1.1"
name: tasks-weekly-next-step
description: Weekly читает всё доступное дерево и предлагает следующий шаг активному leaf project.
tags: [tasks, weekly, preview]
plugins: ["../.."]
execution:
  max_turns: 24
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Проведём еженедельный обзор. Сегодня 2026-10-06, Europe/Moscow.
    Работа P-AREA и Подготовка P-FOLDER — всегда; P-SOMEDAY — когда-нибудь,
    его месячный обзор 2026-10-31. Inbox сегодня пуст.
    Для проекта P-ACTIVE «Согласовать макет» следующий шаг, который я выбираю:
    «Отправить заказчику текущий макет; письмо с макетом отправлено».
    Других решений пока нет, изменения не подтверждаю.
    Проверь всё доступное дерево, включая одиночные задачи области и папки.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jedikit-tasks"'
  - name: inbox-read
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list_inbox
  - name: tree-read
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_list
  - name: active-project-tasks
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_list
    input_match: '"projectId"\s*:\s*"P-ACTIVE"'
  - name: never-task-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_create
    min: 0
    max: 0
  - name: never-task-update
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_update
    min: 0
    max: 0
  - name: never-task-move
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_move
    min: 0
    max: 0
  - name: never-task-cancel
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_cancel
    min: 0
    max: 0
  - name: never-project-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_create
    min: 0
    max: 0
  - name: never-habit-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__habit_list
    min: 0
    max: 0
  - name: never-kanban-status-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__kanban_status_list
    min: 0
    max: 0
  - name: never-task-change-column
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_change_column
    min: 0
    max: 0
  - name: weekly-proposal
    type: llm
    focus: trace
    criteria: |
      PASS: прочитаны P-AREA/P-FOLDER и их одиночные задачи, P-ACTIVE и его задачи;
      отсутствие шага установлено по полному fixture list. Один Preview предлагает
      только выбранный стартуемый шаг для P-ACTIVE; Папка своего шага не требует.
      P-SOMEDAY перечислен отдельно с месячным окном и исключён из активного выбора.
      Ответ сообщает охват и оставшиеся решения, не считает число завершений результатом,
      не вводит недельную квоту и не выполняет предложение без подтверждения.
      FAIL: читается только Today, забыты одиночные задачи папки/области, шаг требуется
      для Когда-нибудь, Triage заявлен выполненным без разбора либо есть запись.
