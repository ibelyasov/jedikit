schema_version: "1.1"
name: tasks-folder-inference
description: Типы области, папки и проекта определяются по актуальным связям дерева.
tags: [tasks, tree, read-only]
plugins: ["../.."]
execution:
  max_turns: 14
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Прочитай дерево и объясни, где области, папки и проекты. Проверь объект
    Подготовка P-FOLDER: нужен ли ему свой следующий шаг?
    Известные настройки в этом разговоре: Europe/Moscow; Работа P-AREA — всегда;
    P-SOMEDAY — когда-нибудь. Настройки никуда не сохраняй, изменения не предлагай.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jedikit-tasks"'
  - name: tree-read
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_list
  - name: never-task-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_create
    min: 0
    max: 0
  - name: never-task-update
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_update
    min: 0
    max: 0
  - name: never-task-move
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_move
    min: 0
    max: 0
  - name: never-task-cancel
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_cancel
    min: 0
    max: 0
  - name: never-project-create
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__project_create
    min: 0
    max: 0
  - name: never-habit-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__habit_list
    min: 0
    max: 0
  - name: never-kanban-status-list
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__kanban_status_list
    min: 0
    max: 0
  - name: never-task-change-column
    type: tool_used
    tool: mcp__plugin_jedikit_singularity__task_change_column
    min: 0
    max: 0
  - name: actual-hierarchy
    type: llm
    focus: last_message
    criteria: |
      PASS: Работа P-AREA — Область; Подготовка P-FOLDER — Папка потому, что
      у неё дочерний P-ACTIVE; P-ACTIVE — Проект без дочерних проектов.
      Папке не нужен собственный результат/следующий шаг; шаг нужен активному
      дочернему Проекту. P-SOMEDAY не требует следующего шага. Нет пометок папки,
      служебных тегов или настройки по имени вместо актуальных связей.
      FAIL: папке придуман обязательный следующий шаг, создан «Общее» либо
      дерево/типы сохранены в памяти как состояние.
