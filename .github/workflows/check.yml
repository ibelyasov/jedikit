name: Статические проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  claude:
    name: Claude Code — декларации
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLAUDE_CONFIG_DIR: /tmp/jedikit-claude-static
      DISABLE_AUTOUPDATER: "1"
    steps:
      - name: Получить исходники
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # https://code.claude.com/docs/en/setup#install-a-specific-version
      - name: Установить Claude Code 2.1.289
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.289
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Показать версию Claude Code
        run: claude --version
      - name: Проверить каталог строго
        run: claude plugin validate . --strict
      - name: Проверить manifest Claude Code строго
        run: claude plugin validate .claude-plugin/plugin.json --strict
      - name: Проверить пробелы в исходниках
        run: git diff --check

  hermes:
    name: Hermes — декларации и scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получить исходники
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Проверить пакет официальным Action Hermes
        # Перейти на следующий Hermes release tag, когда он включает исправление.
        uses: NousResearch/hermes-agent/.github/actions/plugin-validate@781334eea4b9225a3e194faf0c241d9afe218634
        with:
          path: .
          hermes-ref: 781334eea4b9225a3e194faf0c241d9afe218634
